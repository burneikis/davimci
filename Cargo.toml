[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/burneikis/davimci"
authors = ["davimci contributors"]

[workspace.dependencies]
# internal
davimci-core      = { path = "crates/davimci-core" }
davimci-cmd       = { path = "crates/davimci-cmd" }
davimci-motion    = { path = "crates/davimci-motion" }
davimci-analysis  = { path = "crates/davimci-analysis" }
davimci-backend   = { path = "crates/davimci-backend" }
davimci-mlt-sys   = { path = "crates/davimci-mlt-sys" }
davimci-mlt       = { path = "crates/davimci-mlt" }
davimci-lua       = { path = "crates/davimci-lua" }
davimci-keys      = { path = "crates/davimci-keys" }
davimci-app       = { path = "crates/davimci-app" }
davimci-present   = { path = "crates/davimci-present" }
davimci-gui       = { path = "crates/davimci-gui" }
davimci-tui       = { path = "crates/davimci-tui" }
davimci-headless  = { path = "crates/davimci-headless" }
davimci-pack      = { path = "crates/davimci-pack" }

# external
thiserror = "2"
mlua     = { version = "0.12", features = ["lua54", "vendored"] }
anyhow    = "1"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
tracing   = "0.1"
proptest  = "1"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
insta     = { version = "1", features = ["yaml"] }
ratatui   = "0.30"
crossterm = "0.29"
rustix    = { version = "1", features = ["event", "stdio", "process"] }
egui      = "0.35"
# Pinned to what eframe links: the window hands its own device to the planar
# renderer, so two wgpu versions would be two incompatible `Device` types.
wgpu      = "29"
pollster  = "0.4"
eframe    = { version = "0.35", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# An error type carries its own user-facing sentence and its class, so the
# `# Errors` section would restate the variant list rather than add to it.
missing_errors_doc = "allow"
# Modifier and flag sets are bools by nature; bundling them into an enum would
# only re-encode a set as a name.
struct_excessive_bools = "allow"
# Phase 0: no panics in library code. Invariant assertions are the documented
# exception and must use the assert_invariant! macro.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"

[profile.dev]
opt-level = 1          # debug builds still decode video at a usable speed

[profile.dev.package."*"]
opt-level = 3          # dependencies always optimized
