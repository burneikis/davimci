[package]
name = "davimci-cli"
description = "davimci binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "davimci_cli"
path = "src/lib.rs"

[[bin]]
name = "davimci"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
davimci-core.workspace = true
davimci-cmd.workspace = true
anyhow.workspace = true
davimci-analysis.workspace = true
davimci-app.workspace = true
davimci-backend.workspace = true
davimci-keys.workspace = true
davimci-present.workspace = true
davimci-headless.workspace = true
davimci-gui.workspace = true
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
davimci-mlt.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
davimci-tui = { workspace = true, optional = true }

[dev-dependencies]
davimci-core = { workspace = true, features = ["testing"] }

[features]
default = ["window"]
# The window. Off, the binary is the scriptable driver and needs no display.
window = ["dep:eframe", "dep:egui", "davimci-gui/window"]
slow-tests = ["davimci-analysis/slow-tests", "davimci-mlt/slow-tests"]
tui = ["dep:davimci-tui"]
