[package]
name = "davimci-present"
description = "winit+wgpu video presenter (embedded and detached hosts)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
davimci-core.workspace = true
davimci-backend.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, optional = true }

[dev-dependencies]
pollster.workspace = true
wgpu.workspace = true
davimci-core = { workspace = true, features = ["testing"] }

[features]
# The planar YUV upload path. Off, the crate needs no GPU at all and the CPU
# composition - the reference every parity test asserts - is all there is.
gpu = ["dep:wgpu"]
slow-tests = []
