[package]
name = "vimci-cli"
description = "vimci binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vimci"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vimci-core.workspace = true
anyhow.workspace = true
vimci-analysis.workspace = true
vimci-mlt.workspace = true
vimci-tui = { workspace = true, optional = true }

[features]
slow-tests = ["vimci-analysis/slow-tests", "vimci-mlt/slow-tests"]
tui = ["dep:vimci-tui"]
