[package]
name = "davimci-gui"
description = "Primary GUI frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
davimci-app.workspace = true
davimci-present.workspace = true
davimci-core.workspace = true
davimci-keys.workspace = true
egui = { workspace = true, optional = true }

[dev-dependencies]
davimci-app = { workspace = true, features = ["testing"] }
davimci-cmd.workspace = true
davimci-core = { workspace = true, features = ["testing"] }
davimci-headless.workspace = true

[features]
default = ["window"]
# The egui rasteriser. Off, the crate is pure and needs no display at all.
window = ["dep:egui"]
slow-tests = []
