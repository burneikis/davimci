name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast gate: must stay quick, runs on every push.
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install libmlt
        run: |
          sudo apt-get update
          sudo apt-get install -y libmlt-dev libmlt++-dev libmlt-data ffmpeg fonts-dejavu-core
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Real decode/encode. Slower, so it is a separate job.
  slow:
    name: slow tests (render/export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libmlt + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libmlt-dev libmlt++-dev libmlt-data ffmpeg fonts-dejavu-core
      - name: Generate fixtures
        run: ./scripts/gen-fixtures.sh
      - run: cargo test --workspace --features slow-tests -- --include-ignored

  # Presenter and GUI snapshot tests need a GPU; lavapipe provides a software one.
  graphics:
    name: graphics snapshots (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libmlt-dev
      - name: Snapshot tests
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          cargo test -p davimci-present -p davimci-gui
          cargo test -p davimci-present --features gpu --test gpu

  # Aimed at the MLT refcount wrapper, the one place davimci owns raw C state.
  sanitize:
    name: address sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libmlt-dev libmlt++-dev
      - name: ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
          # MLT's factory is initialised once and never closed - closing it
          # tears down modules live objects still reference - so its module
          # tables are still allocated at exit by design. Leak detection
          # would report that structural allocation on every run; the memory
          # errors this job exists to catch are still checked.
          ASAN_OPTIONS: detect_leaks=0
        run: cargo test -p davimci-mlt --target x86_64-unknown-linux-gnu

  # Every example config in the docs must load.
  lua-configs:
    name: lua config compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libmlt-dev
      - run: cargo test -p davimci-lua -- --include-ignored

  # Licence hygiene: MLT must never be static-linked, melt never vendored.
  licence:
    name: licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid static MLT / vendored melt
        run: |
          # Code only: a doc comment saying MLT is never static-linked is the
          # rule being kept, not a breach of it.
          code() { grep -rn --include=build.rs "$1" crates/ | grep -v '^\S*:[0-9]*: *\(//\|#\)'; }
          if code 'statik( *true *)' || code 'rustc-link-lib=\(.*:\)\?static' ; then
            echo "::error::MLT must be dynamically linked: davimci is GPL-3.0 over LGPL-2.1 MLT"
            exit 1
          fi
          if find crates vendor -iname 'melt*' -not -name '*.md' 2>/dev/null | grep . ; then
            echo "::error::melt/melted must never be vendored: davimci is GPL-3.0 over LGPL-2.1 MLT"
            exit 1
          fi
          echo "ok"
