name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libmlt is LGPL-2.1 and dynamically linked, so it is a build input here
      # and a runtime dependency on the user's machine; it is never shipped.
      - name: Install libmlt
        run: |
          sudo apt-get update
          sudo apt-get install -y libmlt-dev libmlt++-dev clang
      - run: cargo build --release -p davimci-cli
      - name: Package
        run: |
          asset=davimci-${{ matrix.triple }}.tar.gz
          tar -czf "$asset" -C target/release davimci
          sha256sum "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: davimci-${{ matrix.triple }}
          path: |
            davimci-${{ matrix.triple }}.tar.gz
            davimci-${{ matrix.triple }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # The changelog is the release notes; commit titles are not written for
      # users. A tag with no matching section is a mistake, so fail loudly.
      - name: Extract changelog section
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section for tag $GITHUB_REF_NAME"
            exit 1
          fi
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
